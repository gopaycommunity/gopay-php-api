name: PHP Composer

on:
  - push
  - pull_request

jobs:
  code-quality:
    runs-on: ubuntu-latest

    name: Code quality

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check coding style
        run: composer cs-check

      - name: Run static analysis
        run: composer phpstan

  security-audit:
    runs-on: ubuntu-latest

    name: Security audit

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --locked

  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macOS-latest]
        php-versions: ["8.1", "8.2", "8.3", "8.4"]

    name: PHP ${{ matrix.php-versions }} unit tests on ${{ matrix.operating-system }}

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Check PHP Version
        run: php -v

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: php vendor/phpunit/phpunit/phpunit --testsuite unit

  # Integration tests call the GoPay sandbox and create real sandbox payments,
  # so they run once instead of in every job of the matrix. The job runs both
  # suites to measure code coverage of the whole SDK.
  integration:
    runs-on: ubuntu-latest

    name: Integration tests and coverage

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run all tests with coverage
        run: php vendor/phpunit/phpunit/phpunit --coverage-clover build/coverage/clover.xml --coverage-text=build/coverage/coverage.txt

      - name: Add coverage summary to the job summary
        if: always() && hashFiles('build/coverage/coverage.txt') != ''
        run: |
          echo '### Code coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build/coverage/coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('build/coverage/clover.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage/
