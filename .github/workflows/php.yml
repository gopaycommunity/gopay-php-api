name: PHP Composer

on:
  - push
  - pull_request

jobs:
  code-quality:
    runs-on: ubuntu-latest

    name: Code quality

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check coding style
        run: composer cs-check

      - name: Run static analysis
        run: composer phpstan

  build:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ubuntu-latest, windows-latest, macOS-latest]
        php-versions: ["8.1", "8.2", "8.3", "8.4"]

    name: PHP ${{ matrix.php-versions }} unit tests on ${{ matrix.operating-system }}

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Check PHP Version
        run: php -v

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: php vendor/phpunit/phpunit/phpunit --testsuite unit

  # Integration tests call the GoPay sandbox and create real sandbox payments,
  # so they run once instead of in every job of the matrix.
  integration:
    runs-on: ubuntu-latest

    name: Integration tests

    steps:
      - uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run integration tests
        run: php vendor/phpunit/phpunit/phpunit --testsuite integration
